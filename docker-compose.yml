# The nightly worker. No ports: it only talks outward (news sites, Groq, Supabase, push services).
services:
  worker:
    build: .
    container_name: morning-brief-voice
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${BRIEFING_TIMEZONE:-America/Toronto}
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 3g
